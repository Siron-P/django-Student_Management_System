{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Preregister — ceniQ</title>
  <link rel="stylesheet" href="{% static 'CSS/styles.css' %}" />
</head>
<body>

  <header class="navbar">
    <div class="wrap navbar-inner">
      <div class="brand">
        <span class="brand-sub">Admin — Preregister</span>
      </div>
      <nav class="nav-links">
        <a href="{% url 'accounts:admin_dashboard' %}" class="nav-link">Dashboard</a>
        <form method="post" action="{% url 'accounts:logout' %}" style="display:inline;">
          {% csrf_token %}
          <button type="submit" class="nav-link">Log out</button>
        </form>
      </nav>
    </div>
  </header>

  <main class="auth-main">
    <div class="wrap auth-wrap">
      <div class="auth-card">
        <div class="auth-head">
          <h1>Preregister a Student or Teacher</h1>
        </div>

        {% if form.errors %}
        <div class="auth-error" role="alert">
          Please fix the errors below.
        </div>
        {% endif %}

        <form method="post" action="{% url 'accounts:preregister' %}" class="auth-form">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit" class="btn btn-primary btn-block">Add</button>
        </form>
      </div>
    </div>
  </main>

</body>
</html>
